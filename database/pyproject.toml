[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gim-db"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["psycopg[binary,pool]==3.2.13", "arq==0.28.0", "httpx==0.28.1"]
[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]
materials = ["openpyxl==3.1.5", "python-docx==1.2.0", "pypdf==6.1.1"]
diagram = ["Pillow==11.3.0"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
[tool.setuptools.packages.find]
where = ["src"]
