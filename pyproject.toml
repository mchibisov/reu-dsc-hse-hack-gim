[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gim-volunteer-bot"
version = "0.1.0"
description = "VK-бот предварительного отбора волонтёров ГИМ"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "httpx>=0.27,<1", "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1", "aiosqlite>=0.20,<1", "arq>=0.26,<1",
  "openpyxl>=3.1,<4", "pydantic-settings>=2.6,<3", "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
