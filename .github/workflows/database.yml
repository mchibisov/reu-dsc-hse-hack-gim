name: database
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: database
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: gim_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gim_test"
          --health-interval 3s --health-timeout 2s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/gim_test
      DATABASE_ADMIN_URL: postgresql://postgres:test-only@127.0.0.1:5432/gim_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv sync --frozen --extra test --extra materials
      - run: uv run python -m gim_db.migrate
      - run: uv run pytest -q
      - run: uv run --project database python -m unittest discover -s tests -p 'test_shared*.py' -v
        working-directory: .
      - run: docker build -t gim-db:test .
      - run: docker build -t gim-bot:test .
        working-directory: .
      - name: Verify packaged default rubric
        working-directory: .
        run: >-
          docker run --rm gim-bot:test python -c
          "import json; from pathlib import Path; from gim.shared_config import SharedSettings;
          rubric = json.loads(Path(SharedSettings.__dataclass_fields__['analysis_rubric_path'].default).read_text(encoding='utf-8-sig'));
          assert rubric['rubric']['scoring_method'] == 'binary_50_35_15'"
      - name: Verify image entry point
        working-directory: .
        run: docker run --rm gim-bot:test python -m gim.shared_main --help
      - name: Verify Compose
        working-directory: .
        run: docker compose --env-file .env.example config --no-env-resolution --quiet
