name: MVP checks
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gim
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: gim_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gim -d gim_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      GIM_TEST_DATABASE_URL: postgresql+asyncpg://gim:ci-test-only@localhost:5432/gim_test
      GIM_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e '.[test]'
      - run: python -m ruff check src tests
      - run: python -m pytest -q
      - run: docker build -t gim-ci .
      - name: Validate Compose with synthetic configuration
        run: |
          cp .env.example .env
          VK_TOKEN=ci-fake VK_GROUP_ID=1 ADMIN_IDS=1 POSTGRES_PASSWORD=ci-only INTERNAL_API_KEY=ci-only docker compose config --quiet
