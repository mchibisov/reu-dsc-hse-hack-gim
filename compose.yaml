services:
  gateway:
    image: ${GIM_IMAGE:-gim-mvp-final:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    command: [python, -m, gim.shared_main, gateway]
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  worker:
    image: ${GIM_IMAGE:-gim-mvp-final:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      STORAGE_DIR: /data/files
    volumes: [shared_files:/data/files]
    command: [python, -m, gim.shared_main, worker]
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
volumes:
  shared_files:
